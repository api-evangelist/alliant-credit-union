name: Alliant Credit Union
kind: company
description: >-
  Alliant Credit Union is a federally chartered, member-owned credit union
  headquartered in Chicago, Illinois, regulated by the National Credit Union
  Administration (NCUA). Founded in 1935 as the United Airlines Employees'
  Credit Union and rebranded Alliant in 2003, it is one of the largest credit
  unions in the United States, with more than 800,000 members and over $19
  billion in assets. Alliant operates as a digital-first, branchless
  institution offering consumer and commercial deposit accounts, high-yield
  savings and checking, credit cards, auto and home loans, and business
  banking. Like nearly all U.S. credit unions, Alliant publishes no public
  first-party developer API or developer portal; consumer-permissioned data
  access is available to members only through third-party aggregators (Plaid,
  MX, Finicity, Akoya) rather than a directly documented open-finance API.
